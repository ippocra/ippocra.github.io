# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings

title: Ippocra
email: info@ippocra.com
url: "https://ippocra.com" # the base hostname & protocol for your site, e.g. http://example.com



# Build settings
theme: minimal-mistakes-jekyll
#minimal_mistakes_skin: "default" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"
minimal_mistakes_skin: "mint"
locale               : "en"
logo: "/assets/images/ippo-outline-green.webp"
masthead_title: "Ippocra"
sass:
  quiet_deps: true    # Disable printing deprecation warnings to terminal
teaser: /assets/images/teaser-news-blog.png

defaults:
  # _posts
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true

  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false

# Site Sidebar used in the post
author:
  name: "Ippocra"
  avatar: "assets/images/ippocra-logo-white-ippo-green-background.png"
  bio: "Your health records at your fingertips"
  location: "Planet Earth"
  links:
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook-square"
      url: https://www.facebook.com/profile.php?id=61564933710120
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: https://www.linkedin.com/company/ippocra/

# Site Footer
footer:
  links:
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook-square"
      url: https://www.facebook.com/profile.php?id=61564933710120
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: https://www.linkedin.com/company/ippocra/
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: https://www.youtube.com/@Ippocra
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: https://www.instagram.com/ippocra/

############################################################
# Blog pagination removed — using custom blog_index layout
# with polyglot-aware language filtering instead.
############################################################

# Custom scripts
head_scripts:
  - /assets/js/ippocra-tracking.js

jekyll-minifier:
  uglifier_args:
    harmony: true

# Polyglot

languages: ["it", "en", "el"]
default_lang: "it"
exclude_from_localization: ["javascript", "images", "css", "public", "README.md", "sitemap"]
parallel_localization: false
# practical values langsep are "|", "•", "·", "-", "–"
langsep: "|"
keywords:
  en: family health documents, medical report management, secure health records, share reports with doctor, caregiver health app, DICOM viewer online, CT scan sharing, MRI online, IppoLink secure sharing, encrypted medical data, digital health records, organize medical reports
  it: documenti sanitari famiglia, gestione referti medici, archiviazione sicura referti, condivisione referti medico, app referti famiglia, caregiver documenti sanitari, visualizzatore DICOM online, condivisione TAC, risonanza magnetica online, IppoLink condivisione sicura, crittografia dati sanitari, organizzare referti online
  el: ιατρικά έγγραφα οικογένειας, διαχείριση ιατρικών εξετάσεων, ασφαλής αποθήκευση ιατρικών αρχείων, κοινοποίηση εξετάσεων με γιατρό, εφαρμογή φροντιστή υγείας, online προβολή DICOM, κοινοποίηση αξονικής, κοινοποίηση μαγνητικής, ασφαλής κοινοποίηση IppoLink, κρυπτογραφημένα ιατρικά δεδομένα, οργάνωση ιατρικών εγγράφων

include:
  - _pages

exclude:
  - README.md

whitelist:
  - jekyll-redirect-from


# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
